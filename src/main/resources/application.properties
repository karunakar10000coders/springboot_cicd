# Application
spring.application.name=spring-boot-cicd-demo
server.port=8080

# Actuator - expose health and info endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# App info (shows up at /actuator/info)
info.app.name=Spring Boot CI/CD Demo
info.app.description=A simple Spring Boot app for Jenkins freestyle project practice
info.app.version=1.0.0
